services:
  server:
    image: lscr.io/linuxserver/radarr:latest
    networks:
      - caddy
    volumes:
      - /plex/radarr/config:/config
      - /plex/media/movies:/movies
      - /plex/media/downloads:/downloads
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    labels:
      caddy: movies.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 7878}}"

networks:
  caddy:
    external: true
